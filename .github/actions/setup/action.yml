name: Set up Node and dependencies
description: Installs Node 24 and restores node_modules from the cache, running npm ci only when package-lock.json changed.

inputs:
  viewer-host:
    description: Also install viewer-host/node_modules
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - id: node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - if: inputs.viewer-host == 'true'
      id: viewer-host
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: viewer-host/node_modules
        key: viewer-host-node-modules-${{ runner.os }}-${{ hashFiles('viewer-host/package-lock.json') }}
    - if: inputs.viewer-host == 'true' && steps.viewer-host.outputs.cache-hit != 'true'
      shell: bash
      run: npm --prefix viewer-host ci --ignore-scripts
