# Flows Explore config for the wallet app: setup signs in, then the e2e flows under flows/ run on the same session.
# The flows are plain e2e tests (https://e2e.tester.army); every `app.screenshot(label)` is a compared frame.
mode: flows
app:
  name: Wallet
  platform: ios
  bundleId: com.expo-explore.example.wallet
  easProfile: explore
  scheme: explore-example-wallet
navigation:
  provider: expo-router
device:
  name: iPhone 17
capture:
  maxMinutes: 30
  maxActions: 300
flows:
  tests:
    - flows/*.e2e.ts
setup:
  - action: open
    url: explore-example-wallet://onboarding/currency
    ready: { identifier: currency-continue, enabled: true }
  - action: tap
    identifier: currency-continue
    ready: { identifier: auth-name }
  - action: open
    url: explore-example-wallet://auth/sign-up
    ready: { label: Create your account }
  - action: fill
    identifier: auth-name
    text: Review User
  - action: fill
    identifier: auth-email
    text: reviewer@example.test
  - action: fill
    identifier: auth-password
    text: WalletReview123!
  - action: tap
    identifier: auth-submit
    ready: { identifier: home-balance }
