mode: flows
app:
  name: Wallet
  platform: ios
  bundleId: com.expo-explore.example.wallet
  easProfile: explore
  scheme: explore-example-wallet
navigation:
  provider: expo-router
device:
  name: iPhone 17
exploration:
  scope: changes
capture:
  maxMinutes: 30
  maxActions: 300
  appearance: auto
  launch: screenshot
  reset: root-link
  unattributed: publish
setup:
  - action: open
    url: explore-example-wallet://onboarding/currency
    ready:
      identifier: currency-continue
      enabled: true
  - action: tap
    identifier: currency-continue
    ready:
      identifier: auth-name
  - action: open
    url: explore-example-wallet://auth/sign-up
    ready:
      label: Create your account
  - action: fill
    identifier: auth-name
    text: Review User
  - action: fill
    identifier: auth-email
    text: reviewer@example.test
  - action: fill
    identifier: auth-password
    text: WalletReview123!
  - action: tap
    identifier: auth-submit
    ready:
      identifier: home-balance
flows:
  tests:
    - e2e/*.e2e.ts
